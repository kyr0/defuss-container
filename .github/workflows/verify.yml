name: Verify
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node --test tests/archive.test.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: node --test tests/build.test.mjs
      - run: cargo build --locked
      - run: python scripts/control-smoke.py
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm run prepare:host
        working-directory: desktop
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo check --manifest-path desktop/native/Cargo.toml --locked
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: desktop
      - if: runner.os == 'Linux'
        run: npm run test:ui
        working-directory: desktop
  # Real VM tests intentionally require suitable hardware; scripts/vm-smoke.py is
  # the explicit hardware gate. Hosted runner success does not certify hypervisors.
