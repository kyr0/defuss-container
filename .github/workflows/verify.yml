# The same verbs as local development (`make verify`), so CI cannot drift from the local gate.
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Full gate on Linux, guest e2e included: hosted Linux runners expose /dev/kvm.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tauri and Playwright system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: make setup
      - run: cd desktop && bunx playwright install-deps chromium webkit
      - run: make verify
      - run: make native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: output/
          if-no-files-found: ignore

  # Hosted macOS and Windows runners: every gate that needs no VM.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node --test tests/archive.test.mjs
      - run: node --test tests/build.test.mjs
      - run: cargo build --locked
      - run: python scripts/control-smoke.py
      - run: cd desktop && bun install --frozen-lockfile --ignore-scripts && bun run prepare:host
      - run: cd desktop && bunx playwright install --with-deps chromium webkit && bun run test:ui
      - run: cargo check --manifest-path desktop/native/Cargo.toml --locked

  # Guest execution on macOS and Windows. GitHub documents that hosted arm64 macOS runners do not support nested
  # virtualization; whether hosted Windows runners expose Windows Hypervisor Platform is UNKNOWN (the run reports
  # it in output/e2e). Set the repository variables MACOS_HV_RUNNER / WINDOWS_HV_RUNNER to the JSON runs-on value of a
  # runner with a usable hypervisor, e.g. ["self-hosted","macOS","ARM64"]; the job then becomes blocking.
  # Without them it still runs on the hosted runner, reports the hypervisor gap, and does not fail the workflow.
  guest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: ${{ vars.MACOS_HV_RUNNER || '"macos-latest"' }}
            capable: ${{ vars.MACOS_HV_RUNNER != '' }}
          - platform: windows
            runner: ${{ vars.WINDOWS_HV_RUNNER || '"windows-latest"' }}
            capable: ${{ vars.WINDOWS_HV_RUNNER != '' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    continue-on-error: ${{ !matrix.capable }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cd desktop && bun install --frozen-lockfile --ignore-scripts && bunx playwright install --with-deps chromium webkit && bun run build
      - run: python scripts/install.py --home tmp/e2e/install
      - run: python tests/e2e/run.py --install tmp/e2e/install --dist desktop/dist --output output/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.platform }}
          path: output/
          if-no-files-found: ignore
