[package]
name = "defuss-container"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Local Bun application machines: daemon, CLI and desktop client"

[workspace]
exclude = ["desktop/native"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
dunce = "1"
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true

